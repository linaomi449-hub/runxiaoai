<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>润小爱 · 二维码</title>
<style>
body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#faf6f0,#f5ede0);font-family:system-ui,-apple-system,sans-serif}
.card{background:#fff;border-radius:20px;padding:32px 28px;box-shadow:0 8px 32px rgba(200,112,60,.12);text-align:center;max-width:320px}
.card h1{font-size:18px;font-weight:700;color:#3d2e1f;margin:0 0 4px}
.card p{font-size:13px;color:#8a7a68;margin:0 0 20px}
#qrcode{display:inline-block;margin:0 auto;padding:12px;border:1px solid #f0e8dc;border-radius:12px}
.url{margin-top:16px;font-size:11px;color:#bbb;word-break:break-all;max-width:240px;margin:12px auto 0}
.hint{font-size:11px;color:#c8703c;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h1>润小爱 · 产品智能咨询助手</h1>
<p>微信扫码即可咨询</p>
<div id="qrcode"></div>
<div class="url">https://yuanqi.tencent.com/webim/#/chat/bEGCPj?appid=2083169587444756736&experience=true</div>
<div class="hint">手机微信扫码后直接打开智能体对话</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
new QRCode(document.getElementById("qrcode"),{
  text:"https://yuanqi.tencent.com/webim/#/chat/bEGCPj?appid=2083169587444756736&experience=true",
  width:200,
  height:200,
  colorDark:"#3d2e1f",
  colorLight:"#ffffff",
  correctLevel:QRCode.CorrectLevel.H
});
</script>
</body>
</html>
